name: Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          cache-dependency-glob: resume/uv.lock

      - name: Sync resume Python env (rendercv)
        run: uv sync --project resume --frozen

      - run: bun install --frozen-lockfile

      - name: Format check (oxfmt)
        run: bun run format:check

      - name: Lint (oxlint)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
